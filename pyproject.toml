[project]
name = "plotnine-narwhals-test"
version = "0.1.0"
description = "Demonstrates plotnine working with polars, without pandas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.23",
    "mizani",
    "plotnine",
    "polars>=1.24",
    "pyarrow>=19",
    "scikit-misc>=0.5.1",
]

[tool.uv]
package = false

[tool.uv.sources]
plotnine = { path = "wheels/plotnine-0.16.0+narwhals-py3-none-any.whl" }
mizani = { path = "wheels/mizani-0.14.7+optionalpandas-py3-none-any.whl" }
